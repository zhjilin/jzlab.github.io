- title: "MoRNiNG: A Database of RNA Modification Sites Associated with RNA Secondary Structure Dynamics"
  image: GPB_2025.png
  description: RNA structures are essential building blocks of functional RNA molecules. Profiling secondary structures in vivo and in real time remains challenging because RNAs exhibit dynamic structures and complex conformations. Besides the canonical stem-loop secondary structure, non-canonical structure RNA G-quadruplex (rG4) has attracted interest for its potential as a drug target. How distinct RNA structures, formed from the same RNA sequences, function within the transcriptome is poorly understood, and factors driving and regulating structure transitions remain to be investigated. Inspired by an HOXB9 segment able to form multiple structures, we found that many RNA segments across the transcriptome exhibit multi-faceted structure-forming potential. In the case of HOXB9, we demonstrate that N6-methyladenosine (m6A) modification influences RNA structure and binding to RNA-binding proteins (RBPs). Therefore, we collected RNA modification sites naturally occurring within the putative G-quadruplex-forming sequences (PQSs) of transcripts and developed MoRNiNG, a database for RNA modifications in natural rG4, which is freely accessible at https://www.cityu.edu.hk/bms/morning.
  authors: Yicen Zhou, Shanxin Lyu, Shiau Wei Liew, Xi Mao, Ian Hoffecker, Jian Yan, Yu Li, Chun Kit Kwok, <strong><ins>Jilin Zhang</strong></ins>
  link:
    url: https://doi.org/10.1093/gpbjnl/qzaf106
    display: Genomics, Proteomics and Bioinformatics, (2025)
