- title: "Patterns and Processes of Genomic Evolution Inferred From the Ten Smallest Vertebrate Genomes"
  image: advs_2025.jpg
  description: Pufferfish exhibit the smallest vertebrate genomes, making them ideal models for investigating evolutionary patterns and processes that affect genome size. While the Takifugu rubripes genome was fully sequenced two decades ago, key evolutionary drivers remain elusive. We sequenced 10 pufferfish genomes and generated 35 transcriptomes and 13 methylomes to understand genomic evolutionary mechanisms. Comparative genomics revealed that transposable element suppression—rather than lineage-specific conserved element loss—primarily underlies genome compaction. This is mediated by reductions in transposon-associated enzymes that limit transposable element propagation and modify DNA repair mechanisms that promote genomic streamlining.Our indings shed light on mechanisms enabling extreme vertebrate genome compaction and provide insights for genome engineering applications. 
  authors: Kaiqiang Liu, Qian Wang, Ning Wang, Lingfeng Meng, Shuo Li, Hong-Yan Wang, Yuyan Liu, Qian Liu, Yangqing Zhang, Lucas B. Doretto, Mengqi Zhang, Yating Qin, Shanshan Pan, Shenglei Han, Weijing Li, Shanshan Liu, Fengtao Gao, Axel Meyer, Jussi Taipale, Guangyi Fan, Manfred Schartl, <strong><ins>Jilin Zhang</strong></ins>, Changwei Shao
  link:
    url: https://doi.org/10.1002/advs.202417251
    display: Advanced Science, (2025)
    highlight: 1
