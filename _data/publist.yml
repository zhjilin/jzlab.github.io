- title: "Shared requirement for MYC upstream super-enhancer region in tissue regeneration and cancer"
  image: 
  description: Cancer has been characterized as a wound that does not heal. Malignant cells are morphologically distinct from normal proliferating cells but have extensive similarities to tissues undergoing wound healing and/or regeneration. The mechanistic basis of this similarity has, however, remained enigmatic. Here, we show that the genomic region upstream of Myc, which carries more cancer susceptibility in humans than any other genomic region, is required for intestinal regeneration after radiation damage. Failure to regenerate is associated with inefficient Ly6a/Sca1+ stem/progenitor cell mobilization, and almost complete failure to re-establish Lgr5+ cell compartment in the intestinal crypts. The Myc upstream region is also critical for growth of adult intestinal cells in 3D organoid culture. We show that culture conditions recapitulating most aspects of adult normal tissue architecture still reprogram normal cells to proliferate using a mechanism similar to that employed by cancer cells. Our results establish a function for the Myc2-540 super-enhancer region as the genetic link between tissue regeneration and tumorigenesis, and demonstrates that normal tissue renewal and regeneration of tissues after severe damage are mechanistically distinct. 
  authors: Inderpreet Sur, Wenshuo Zhao, <strong><ins>Jilin Zhang</strong></ins>, Margareta Kling Pilström, Anna T Webb, Huaitao Cheng, Ari Ristimäki, Pekka Katajisto, Martin Enge, Helena Rannikmae, Marc de la Roche, Jussi Taipale
  link:
    url: https://doi.org/10.26508/lsa.202403090
    display: Life Science Alliance, (2025)
    highlight: 1
