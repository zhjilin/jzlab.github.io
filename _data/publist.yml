- title: "Populational pan-ethnic screening panel enabled by deep whole genome sequencing"
  image: npjGM_2023.png
  description: Birth defect is a global threat to the public health systems. Mitigating neonatal anomalies is hampered by elusive molecular mechanisms of pathogenic mutations and poor subsequent translation into preventative measures. Applying appropriate strategies in China to promote reproductive health is particularly challenging, as the Chinese population compromises complex genomic diversity due to the inclusion of many ethnic groups with distinct genetic backgrounds. To investigate and evaluate the feasibility of implementing a pan-ethnic screening strategy, and guide future reproductive counselling, high-quality variants associated with autosome recessive (AR) diseases derived from the largest publicly available cohort of the Chinese population were re-analysed using a bottom-up approach. 
  authors: Linfeng Yang, Zhe Lin, Yong Gao, Jianguo Zhang, Huanhuan Peng, Yaqing Li, Jingang Che, Lijian Zhao, <strong><ins>Jilin Zhang</ins></strong>
  link:
    url: https://doi.org/10.1038/s41525-023-00383-8
    display: npj Genomic Medicine, (2023)
