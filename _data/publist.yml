- title: "CRISPR/Cas9 screening using unique molecular identifiers"
  image: msb177834_2017.jpeg
  description: Loss-of-function screening by CRISPR/Cas9 gene knockout with pooled, lentiviral guide libraries is a widely applicable method for systematic identification of genes contributing to diverse cellular phenotypes. Here, Random Sequence Labels (RSLs) are incorporated into the guide library, which act as unique molecular identifiers (UMIs) to allow massively parallel lineage tracing and lineage dropout screening. RSLs greatly improve the reproducibility of results by increasing both the precision and the accuracy of screens. They reduce the number of cells needed to reach a set statistical power, or allow a more robust screen using the same number of cells.
  authors: Bernhard Schmierer, Sandeep K Botla, <strong><ins>Jilin Zhang</ins> </strong>, Mikko Turunen, Teemu Kivioja, Jussi Taipale
  link:
    url: https://www.embopress.org/doi/full/10.15252/msb.20177834
    display:  Molecular Systems Biology, 13:945 (2017)
  highlight: 1
  news2:

- title: "Complex evolutionary trajectories of sex chromosomes across bird taxa"
  image: Science_2014bird.jpeg
  description: We analyze newly available genomes of 17 bird species representing the avian phylogenetic range, and find that more than half of them do not have as fully degenerated W chromosomes as that of chicken. We show that avian sex chromosomes harbor tremendous diversity among species in their composition of pseudoautosomal regions and degree of Z/W differentiation. Punctuated events of shared or lineage-specific recombination suppression have produced a gradient of "evolutionary strata" along the Z chromosome, which initiates from the putative avian sex-determining gene DMRT1 and ends at the pseudoautosomal region.
  authors: Qi Zhou, <strong><ins>Jilin Zhang</ins></strong>, Doris Bachtrog, Na An, Quanfei Huang, Erich D Jarvis, M Thomas P Gilbert, Guojie Zhang
  link:
    url: https://pubmed.ncbi.nlm.nih.gov/25504727/
    display: Science, 346(6215) (2014)
