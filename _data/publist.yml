- title: "The highly conserved RNA-binding specificity of nucleocapsid protein facilitates the identification of drugs with broad anti-coronavirus activity"
  image: csbj_2022covid.jpg
  description: The binding of SARS-CoV-2 nucleocapsid (N) protein to both the 5′- and 3′-ends of genomic RNA has different implications arising from its binding to the central region during virion assembly. However, the mechanism underlying selective binding remains unknown. Herein, we performed the high-throughput RNA-SELEX (HTR-SELEX) to determine the RNA-binding specificity of the N proteins of various coronaviruses and showed that N proteins could bind two unrelated sequences that are highly conserved across species. Interestingly, they are virtually absent from the human transcriptome. Our results provide mechanistic insights into viral genome packaging, thereby increasing the feasibility of developing drugs with broad-spectrum anti-coronavirus activity by targeting RNA binding by N proteins. 
  authors: Shaorong Fan, Wenju Sun, Ligang Fan, Nan Wu, Wei Sun, Haiqian Ma, Siyuan Chen, Zitong Li, Yu Li, <strong><ins>Jilin Zhang</ins></strong>, Jian Yan 
  link:
